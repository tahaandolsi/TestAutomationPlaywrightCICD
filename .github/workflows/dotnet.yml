# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest 

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build ./TestAutomationD.slnx --no-restore
    - name: Install powershell-devops Module
      uses: powershell-devops/powershell-devops@v0.2.0
    - name: Ensure browsers are installed 
      run: pwsh ./TestAutomationD/bin/Debug/net10.0/playwright.ps1 install --with-deps
    - name: Test
      run: dotnet test ./TestAutomationD/ApplicationTestDemo.csproj --no-build --verbosity normal




    
